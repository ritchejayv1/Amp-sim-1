name: Build RG Amp SIM Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # ==========================================================
      # TEMPORARY DEBUG - FIND BinaryData FILES
      # ==========================================================
      - name: DEBUG BinaryData Files
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "RG AMP SIM - BinaryData DEBUG"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Searching for BinaryData files..."
          Write-Host ""

          $files = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -eq "BinaryData.h" -or
              $_.Name -eq "BinaryData.cpp"
            }

          if ($files) {
            foreach ($file in $files) {
              Write-Host "FOUND:"
              Write-Host $file.FullName
              Write-Host ""
            }
          }
          else {
            Write-Host "BinaryData.h / BinaryData.cpp not found yet."
          }

          Write-Host ""
          Write-Host "=========================================="

      - name: Build RG Amp SIM
        run: |
          cmake --build build --parallel

      # ==========================================================
      # TEMPORARY DEBUG - PRINT GENERATED BinaryData.h
      # ==========================================================
      - name: DEBUG BinaryData Header
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "RG AMP SIM - GENERATED BinaryData.h"
          Write-Host "=========================================="

          $header = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "BinaryData.h" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($header) {
            Write-Host ""
            Write-Host "FOUND:"
            Write-Host $header.FullName
            Write-Host ""
            Write-Host "Searching for NAM / IR / JPG resource names..."
            Write-Host ""

            Get-Content $header.FullName |
              Select-String -Pattern `
                "NAM",
                "MBDR",
                "precision",
                "412",
                "mic",
                "wav",
                "jpg",
                "rg100"

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "END BinaryData DEBUG"
            Write-Host "=========================================="
          }
          else {
            Write-Host "BinaryData.h was not found."
            Write-Host "=========================================="
          }

      - name: Find VST3
        shell: pwsh
        run: |
          Write-Host "Searching for VST3..."

          Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "*.vst3" |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Package VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "RG Amp SIM.vst3" |
            Select-Object -First 1

          if (-not $vst3) {
            Write-Error "RG Amp SIM.vst3 was not found."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path package | Out-Null

          Copy-Item `
            -Path $vst3.FullName `
            -Destination "package/RG Amp SIM.vst3" `
            -Recurse

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "package/RG Amp SIM.vst3" `
            -DestinationPath "RG-Amp-SIM-Windows-VST3.zip" `
            -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RG-Amp-SIM-Windows-VST3
          path: RG-Amp-SIM-Windows-VST3.zip
          if-no-files-found: error
