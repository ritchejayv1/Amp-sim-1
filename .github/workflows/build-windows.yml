name: Build RG Amp SIM Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # MSVC
      # ==========================================================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ==========================================================
      # CMAKE CONFIGURE
      # ==========================================================
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # ==========================================================
      # BUILD
      # ==========================================================
      - name: Build RG Amp SIM
        run: |
          cmake --build build --parallel

      # ==========================================================
      # DEBUG EXACT RG AMP SIM BINARYDATA
      # ==========================================================
      - name: DEBUG RG Amp SIM BinaryData
        shell: pwsh
        run: |
          $header = "build/juce_binarydata_AmpSimAssets/JuceLibraryCode/BinaryData.h"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "RG AMP SIM - EXACT BinaryData.h"
          Write-Host "=================================================="

          if (Test-Path $header) {

            Write-Host ""
            Write-Host "FOUND:"
            Write-Host $header
            Write-Host ""

            Write-Host "=================================================="
            Write-Host "NAM / IR / JPG RESOURCE SYMBOLS"
            Write-Host "=================================================="

            Get-Content $header |
              Select-String -Pattern `
                "MBDR",
                "precision",
                "412",
                "mic",
                "rg100",
                "nam",
                "wav",
                "jpg"

            Write-Host ""
            Write-Host "=================================================="
            Write-Host "ALL RESOURCE DECLARATIONS"
            Write-Host "=================================================="

            Get-Content $header |
              Select-String -Pattern `
                "extern const char",
                "extern const int"

          }
          else {
            Write-Host "ERROR: RG Amp SIM BinaryData.h NOT FOUND"
            exit 1
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "END DEBUG"
          Write-Host "=================================================="

      # ==========================================================
      # FIND VST3
      # ==========================================================
      - name: Find VST3
        shell: pwsh
        run: |
          Write-Host "Searching for VST3..."

          Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "*.vst3" |
            ForEach-Object {
              Write-Host $_.FullName
            }

      # ==========================================================
      # PACKAGE VST3
      # ==========================================================
      - name: Package VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "RG Amp SIM.vst3" |
            Select-Object -First 1

          if (-not $vst3) {
            Write-Error "RG Amp SIM.vst3 was not found."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path package | Out-Null

          Copy-Item `
            -Path $vst3.FullName `
            -Destination "package/RG Amp SIM.vst3" `
            -Recurse

      # ==========================================================
      # CREATE ZIP
      # ==========================================================
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "package/RG Amp SIM.vst3" `
            -DestinationPath "RG-Amp-SIM-Windows-VST3.zip" `
            -Force

      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RG-Amp-SIM-Windows-VST3
          path: RG-Amp-SIM-Windows-VST3.zip
          if-no-files-found: error
