name: Build RG Amp SIM Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build RG Amp SIM
        run: |
          cmake --build build --parallel

      # ==========================================================
      # TEMPORARY DEBUG - RG AMP SIM BINARY DATA
      # ==========================================================
      - name: DEBUG RG Amp SIM BinaryData
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "RG AMP SIM - GENERATED BINARY DATA"
          Write-Host "=================================================="
          Write-Host ""

          Write-Host "Searching build directory..."
          Write-Host ""

          $files = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "AmpSimAssets" -or
              $_.Name -eq "BinaryData.h" -or
              $_.Name -eq "BinaryData.cpp"
            }

          if ($files) {
            foreach ($file in $files) {
              Write-Host $file.FullName
            }
          }
          else {
            Write-Host "No matching BinaryData files found."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "SEARCHING FOR RG ASSET FILES"
          Write-Host "=================================================="
          Write-Host ""

          $assets = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "MBDR" -or
              $_.Name -match "precision" -or
              $_.Name -match "412" -or
              $_.Name -match "mic" -or
              $_.Name -match "rg100"
            }

          if ($assets) {
            foreach ($asset in $assets) {
              Write-Host $asset.FullName
            }
          }
          else {
            Write-Host "No matching RG asset files found."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "SEARCHING GENERATED HEADERS FOR RG ASSET NAMES"
          Write-Host "=================================================="
          Write-Host ""

          $headers = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "BinaryData.h" `
            -File `
            -ErrorAction SilentlyContinue

          if ($headers) {

            foreach ($header in $headers) {

              Write-Host ""
              Write-Host "HEADER:"
              Write-Host $header.FullName
              Write-Host "------------------------------------------"

              $matches = Get-Content $header.FullName |
                Select-String -Pattern `
                  "MBDR",
                  "precision",
                  "412",
                  "mic",
                  "rg100"

              if ($matches) {
                foreach ($match in $matches) {
                  Write-Host $match.Line
                }
              }
            }
          }
          else {
            Write-Host "No BinaryData.h found."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "END RG AMP SIM DEBUG"
          Write-Host "=================================================="

      - name: Find VST3
        shell: pwsh
        run: |
          Write-Host "Searching for VST3..."

          Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "*.vst3" |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Package VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "RG Amp SIM.vst3" |
            Select-Object -First 1

          if (-not $vst3) {
            Write-Error "RG Amp SIM.vst3 was not found."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path package | Out-Null

          Copy-Item `
            -Path $vst3.FullName `
            -Destination "package/RG Amp SIM.vst3" `
            -Recurse

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "package/RG Amp SIM.vst3" `
            -DestinationPath "RG-Amp-SIM-Windows-VST3.zip" `
            -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RG-Amp-SIM-Windows-VST3
          path: RG-Amp-SIM-Windows-VST3.zip
          if-no-files-found: error
